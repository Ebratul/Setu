[project]
name = "setu-agent"
version = "0.1.0"
description = "Setu agent service (FastAPI) — simulated sandbox"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.3",
    "fastembed>=0.9.0",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.11",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyotp>=2.10.0",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
]
