      bn: "প্রথম ৩০% এসক্রোতে আছে। সিএনওয়াই অ্যাকাউন্টে প্রথম লেনদেন, তাই ছাড়ে রহিমার এক ট্যাপ লাগে (টিয়ার ২)। টাকা যায় সিএনওয়াইতে, আর ইউএসডির চেয়ে সিএনওয়াই রুটে খরচ কম।"
    notes:
      en: "Escrow is simulated, double-entry. The agent can only ask, only a person can approve. Show the rule trace: the tier is decided by code. Then the CNY saving."
      bn: "এসক্রো সিমুলেটেড, ডাবল-এন্ট্রি। এজেন্ট শুধু অনুরোধ করতে পারে, অনুমোদন দিতে পারে শুধু মানুষ।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: "/app/deals/{deal.ref}"
        highlight: '[data-demo="escrow-card"]'
        caption: { en: "USD 2,880 is held in escrow (simulated ledger)", bn: "২,৮৮০ ডলার এসক্রোতে (সিমুলেটেড খতিয়ান)" }
        actions:
          - id: ledger
            http: "GET /deals/{deal.ref}/ledger"
          - id: detail
            http: "GET /deals/{deal.ref}"
        expect:
          - { label: { en: "Escrow balance is USD 2,880.00", bn: "এসক্রো ব্যালেন্স ২,৮৮০.০০ ডলার" }, at: detail.body.escrow.balance, eq: "2880.00" }
          - { label: { en: "The ledger balances (every entry has its pair)", bn: "খতিয়ান মেলে" }, at: detail.body.escrow.invariant_ok, truthy: true }
      - k: 2
        view: buyer
        login_as: rahima@demo.setu
        route: /app/approvals
        highlight: '[data-demo="approve-button"]'
        caption: { en: "Tier 2: waiting for Rahima's one tap. No code can skip this.", bn: "টিয়ার ২: রহিমার এক ট্যাপের অপেক্ষা। কোড এটি এড়াতে পারে না।" }
        actions:
          - id: release
            http: "POST /milestones/{m1.id}/release"
            json: { idempotency_key: "demo-release-m1-v1" }
