# Guided demo: Rahima's 12-step story. Single source for the orchestrator (backend/app/demo)
# and the /demo UI. Every scene runs REAL services against the judge's own sandbox (no fake data);
# `expect` rows are checked after the actions and ticked in the judge scorecard.
#
# Scene = one beat on screen: `actions` run when the scene starts, `route` is then shown in the
# embedded app, `highlight` is the [data-demo="..."] element to spotlight, `caption` is the bubble.
# Templates: {deal.ref} {deal.id} {m1.id} {m2.id} {m3.id} {huaxin.id} {huameng.id} {pi.id}
# {photo1.id} and anything an action saved ({chat.thread_id}).
# Actions: `http: "METHOD /path"` (the real API, in-process, as `as`) or `call: name` (a registered
# service call, app/demo/actions.py). Expectations: eq ne in gte lte contains matches truthy
# falsy len_gte startswith (numbers compare as decimals).
# Bangla/Chinese strings are not native-reviewed (same known gap as the rest of the app).
version: 1

scorecard:
  - { id: financing, group: TASK, after: "4.3", link: /app/financing,
      label: { en: "Financing options compared and applied", bn: "অর্থায়নের বিকল্প তুলনা ও আবেদন" } }
  - { id: cashflow_alerts, group: TASK, after: "4.1", link: /app/cashflow,
      label: { en: "Cash-flow shortfall alert, then resolved", bn: "নগদ প্রবাহ ঘাটতির সতর্কতা ও সমাধান" } }
  - { id: analysis, group: TASK, after: "3.1", link: "/app/orders/{deal.ref}/analysis",
      label: { en: "Landed cost and margin analysis", bn: "ল্যান্ডেড খরচ ও মার্জিন বিশ্লেষণ" } }
  - { id: kyb, group: TASK, after: "2.2", link: "/app/suppliers/{huaxin.id}",
      label: { en: "Supplier KYB verified (and a risky one flagged)", bn: "সরবরাহকারী কেওয়াইবি যাচাই" } }
  - { id: escrow, group: TASK, after: "6.3", link: "/app/deals/{deal.ref}",
      label: { en: "Milestone escrow with evidence-gated release", bn: "মাইলস্টোন এসক্রো ও প্রমাণ-ভিত্তিক ছাড়" } }
  - { id: forensics, group: TASK, after: "9.1", link: "/app/documents/{forged.id}",
      label: { en: "Trade-document forensics", bn: "বাণিজ্য নথি ফরেনসিক" } }
  - { id: credit_record, group: TASK, after: "12.2", link: "/app/deals/{deal.ref}",
      label: { en: "Signed completed-deal credit record", bn: "স্বাক্ষরিত সম্পন্ন-চুক্তির ক্রেডিট রেকর্ড" } }
  - { id: tiers, group: SECURITY, after: "6.3", link: /app/approvals,
      label: { en: "Permission tiers enforced in code (Tier 1 / 2 / 3)", bn: "কোডে প্রয়োগ করা অনুমতির স্তর" } }
  - { id: otp, group: SECURITY, after: "8.3", link: /app/approvals,
      label: { en: "OTP and cooling-off on a risky change", bn: "ঝুঁকিপূর্ণ পরিবর্তনে ওটিপি ও কুলিং-অফ" } }
  - { id: injection, group: SECURITY, after: "9.3", link: /demo/attack-console,
      label: { en: "Hidden document instruction ignored", bn: "নথির লুকানো নির্দেশ উপেক্ষা" } }
  - { id: fraud_block, group: SECURITY, after: "8.1", link: /app/inbox/email-check,
      label: { en: "Payment-redirection email blocked", bn: "পেমেন্ট-বদলের ইমেইল আটকানো" } }
  - { id: duplicate, group: SECURITY, after: "10.1", link: /app/admin/registry,
      label: { en: "Duplicate financing blocked by the registry", bn: "রেজিস্ট্রিতে দ্বৈত অর্থায়ন আটকানো" } }
  - { id: privacy, group: SECURITY, after: "9.3", link: /demo/privacy-playground,
      label: { en: "Identifiers masked before any AI call", bn: "এআই-কে দেওয়ার আগে পরিচয় তথ্য মাস্ক" } }
  - { id: audit, group: SECURITY, after: "12.3", link: /verify,
      label: { en: "Signed, hash-chained audit log verifies", bn: "স্বাক্ষরিত অডিট লগ যাচাই সফল" } }
  - { id: bangla_chinese, group: INNOVATION, after: "1.1", link: /app/chat,
      label: { en: "Bangla chat, Chinese supplier portal", bn: "বাংলা চ্যাট, চীনা সরবরাহকারী পোর্টাল" } }
  - { id: playgrounds, group: INNOVATION, after: "9.2", link: /demo/risk-playground,
      label: { en: "Live playgrounds: risk, privacy, attacks", bn: "লাইভ প্লেগ্রাউন্ড: ঝুঁকি, গোপনীয়তা, আক্রমণ" } }
  - { id: live_verify, group: INNOVATION, after: "12.3", link: /verify,
      label: { en: "Public verification page, in the browser", bn: "ব্রাউজারে সরাসরি যাচাই পাতা" } }

steps:
  # ---------------------------------------------------------------- 1
  - n: 1
    id: ask-in-bangla
    tag: INNOVATION
    title: { en: "Rahima asks in Bangla", bn: "রহিমা বাংলায় জিজ্ঞাসা করেন" }
    narration:
      en: "Rahima Knitwear imports jersey fabric from China. She asks in Bangla what her new order really costs. The answer cites numbers computed by code, never invented by the AI."
      bn: "রহিমা নিটওয়্যার চীন থেকে জার্সি কাপড় আমদানি করে। তিনি বাংলায় জানতে চান নতুন অর্ডারে মোট খরচ কত। উত্তরের সংখ্যাগুলো কোড হিসাব করে, এআই বানায় না।"
    notes:
      en: "Open with the person, not the tech. Point at the cards under the answer: the AI explains, the code calculates. Mention that chat also works in English and Chinese."
      bn: "প্রযুক্তি নয়, মানুষ দিয়ে শুরু করুন। উত্তরের নিচের কার্ডগুলো দেখান: এআই ব্যাখ্যা করে, কোড হিসাব করে।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: "/app/chat?thread={chat.thread_id}"
        highlight: '[data-demo="chat-answer"]'
        caption: { en: "The answer is in Bangla, with cards built from real numbers", bn: "উত্তর বাংলায়, আসল সংখ্যার কার্ডসহ" }
        actions:
          - id: chat
            http: "POST /chat"
            json:
              message: "আমার নতুন ফেব্রিক অর্ডারের (SETU-2026-0001) মোট ল্যান্ডেড খরচ কত ডলার এবং গ্রস মার্জিন কত?"
              language: bn
              deal_id: "{deal.ref}"
            save: { thread_id: body.thread_id }
        expect:
          - { label: { en: "The answer is written in Bangla", bn: "উত্তর বাংলায় লেখা" }, at: chat.body.answer, matches: "[\\u0980-\\u09FF]{10,}" }
          - { label: { en: "Result cards came from tool calls", bn: "কার্ডগুলো টুল কল থেকে এসেছে" }, at: chat.body.cards, len_gte: 1 }
          - { label: { en: "The answer quotes the landed cost, USD 11,200", bn: "উত্তরে ল্যান্ডেড খরচ ১১,২০০ ডলার উল্লেখ আছে" }, at: chat.body.answer, matches: "11,?200|১১,?২০০" }
        facts: { answer_language: chat.body.language, tools_called: chat.body.tool_calls }

  # ---------------------------------------------------------------- 2
  - n: 2
    id: kyb
    tag: TASK
    title: { en: "Is the supplier real? KYB", bn: "সরবরাহকারী কি আসল? কেওয়াইবি" }
    narration:
      en: "Setu matches the licence name, the invoice name and the receiving account holder. Shaoxing Huaxin passes every check. Guangzhou Huameng is shown as the contrast: licence matches, but the account is personal and three days old."
      bn: "সেতু লাইসেন্সের নাম, ইনভয়েসের নাম ও প্রাপক অ্যাকাউন্টের নাম মিলিয়ে দেখে। শাওশিং হুয়াশিন সব পরীক্ষায় পাস করে। বিপরীত উদাহরণ গুয়াংজু হুয়ামেং: লাইসেন্স মেলে, কিন্তু অ্যাকাউন্টটি ব্যক্তিগত ও তিন দিনের পুরোনো।"
    notes:
      en: "Green badge first, then the red contrast. The KYB score feeds the fraud score used later by the risk tiers."
      bn: "প্রথমে সবুজ ব্যাজ, তারপর লাল বিপরীত উদাহরণ। কেওয়াইবি স্কোর পরে ঝুঁকি স্তরে কাজে লাগে।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: "/app/suppliers/{huaxin.id}"
        highlight: '[data-demo="kyb-badge"]'
        caption: { en: "Verified: 7 of 7 checks pass", bn: "যাচাইকৃত: ৭টির ৭টি পরীক্ষা সফল" }
        actions:
          - id: kyb
            http: "POST /kyb/verify/{huaxin.id}"
            query: { deal_id: "{deal.ref}" }
        expect:
          - { label: { en: "Huaxin is VERIFIED", bn: "হুয়াশিন যাচাইকৃত" }, at: kyb.body.status, eq: VERIFIED }
          - { label: { en: "Score 100 of 100", bn: "স্কোর ১০০ এর ১০০" }, at: kyb.body.score, eq: "100" }
        facts: { score: kyb.body.score }
      - k: 2
        view: admin
        login_as: admin@demo.setu
        route: "/app/suppliers/{huameng.id}"
        highlight: '[data-demo="kyb-badge"]'
        caption: { en: "Contrast: a personal, brand-new account raises a WARNING", bn: "বিপরীত: ব্যক্তিগত ও নতুন অ্যাকাউন্টে সতর্কতা" }
        actions:
          - id: kyb2
            http: "GET /kyb/{huameng.id}"
            as: admin@demo.setu
        expect:
          - { label: { en: "Huameng is flagged WARNING", bn: "হুয়ামেং সতর্কতা পেয়েছে" }, at: kyb2.body.latest.status, eq: WARNING }

  # ---------------------------------------------------------------- 3
  - n: 3
    id: landed-cost
    tag: TASK
    title: { en: "What does the order really cost?", bn: "অর্ডারের আসল খরচ কত?" }
    narration:
      en: "Goods USD 9,600 plus freight, insurance, customs duty and bank charges make a landed cost of USD 11,200. Against an expected sale of USD 13,660 that is an 18% margin."
      bn: "পণ্য ৯,৬০০ ডলার, সঙ্গে ফ্রেইট, বিমা, শুল্ক ও ব্যাংক চার্জ মিলিয়ে ল্যান্ডেড খরচ ১১,২০০ ডলার। প্রত্যাশিত বিক্রয় ১৩,৬৬০ ডলারের বিপরীতে মার্জিন ১৮%।"
    notes:
      en: "Landed cost = goods + freight + insurance + duty + bank charges. USD 11,200. Margin 18.01%. Every figure traces to a line item."
      bn: "ল্যান্ডেড খরচ = পণ্য + ফ্রেইট + বিমা + শুল্ক + ব্যাংক চার্জ = ১১,২০০ ডলার। মার্জিন ১৮.০১%।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: "/app/orders/{deal.ref}/analysis"
        highlight: '[data-demo="landed-cost"]'
        caption: { en: "USD 11,200 landed cost, 18% margin", bn: "ল্যান্ডেড খরচ ১১,২০০ ডলার, মার্জিন ১৮%" }
        actions:
          - id: analysis
            http: "GET /analysis/orders/{deal.ref}"
        expect:
          - { label: { en: "Landed cost is USD 11,200.00", bn: "ল্যান্ডেড খরচ ১১,২০০.০০ ডলার" }, at: analysis.body.landed_cost.USD, eq: "11200.00" }
          - { label: { en: "Gross margin is 18.01%", bn: "মোট মার্জিন ১৮.০১%" }, at: analysis.body.gross_margin_pct, eq: "18.01" }
        facts: { landed_cost: analysis.body.landed_cost.USD, margin_pct: analysis.body.gross_margin_pct }

  # ---------------------------------------------------------------- 4
  - n: 4
    id: cashflow-financing
    tag: TASK
    title: { en: "A cash gap appears. Fix it.", bn: "নগদের ঘাটতি দেখা দিল। সমাধান করুন।" }
    narration:
      en: "The 90-day forecast finds a USD 1,560 shortfall on 7 November, when the second payment is due. Setu compares the financing options, explains why one is blocked, and Rahima applies for the best eligible one."
      bn: "৯০ দিনের পূর্বাভাসে ৭ নভেম্বর, দ্বিতীয় কিস্তির দিন, ১,৫৬০ ডলার ঘাটতি ধরা পড়ে। সেতু অর্থায়নের বিকল্প তুলনা করে, একটি কেন আটকানো তা বলে, আর রহিমা সেরা যোগ্য বিকল্পে আবেদন করেন।"
    notes:
      en: "Shortfall first, never a surprise. The escrow-backed loan is blocked on purpose: this invoice is already financed at Lender A. That is the setup for step 10. The loan is simulated."
      bn: "ঘাটতি আগেই জানানো হয়। এসক্রো-ভিত্তিক ঋণটি ইচ্ছা করেই আটকানো: এই ইনভয়েস ইতিমধ্যে লেন্ডার এ-তে বন্ধক। এটাই ধাপ ১০-এর ভূমিকা।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: /app/cashflow
        highlight: '[data-demo="shortfall-alert"]'
        caption: { en: "Shortfall of USD 1,560 on 7 Nov, found 18 days early", bn: "৭ নভেম্বর ১,৫৬০ ডলার ঘাটতি, ১৮ দিন আগেই ধরা পড়েছে" }
        actions:
          - id: forecast
            http: "GET /cashflow/forecast"
          - id: alerts
            http: "GET /alerts"
        expect:
          - { label: { en: "First shortfall is USD 1,560.00", bn: "প্রথম ঘাটতি ১,৫৬০.০০ ডলার" }, at: forecast.body.first_shortfall.amount, eq: "1560.00" }
          - { label: { en: "It falls on 2026-11-07", bn: "তারিখ ২০২৬-১১-০৭" }, at: forecast.body.first_shortfall.on, eq: "2026-11-07" }
          - { label: { en: "A SHORTFALL alert is open", bn: "ঘাটতির সতর্কতা খোলা" }, at: "alerts.body.alerts[type=SHORTFALL][status=OPEN][0].amount", eq: "1560.00" }
        facts: { shortfall: forecast.body.first_shortfall.amount, shortfall_on: forecast.body.first_shortfall.on }
      - k: 2
        view: buyer
        login_as: rahima@demo.setu
        route: /app/financing
        highlight: '[data-demo="financing-options"]'
        caption: { en: "Options compared on total cost, rate and conditions", bn: "মোট খরচ, হার ও শর্তে বিকল্পের তুলনা" }
        actions:
          - id: match
            http: "POST /financing/match"
            json: { deal_id: "{deal.ref}", mode: shortfall }
        expect:
          - { label: { en: "Five options are compared", bn: "পাঁচটি বিকল্প তুলনা করা হয়েছে" }, at: match.body.options, len_gte: 5 }
          - { label: { en: "Top pick is supplier credit", bn: "সেরা বিকল্প সরবরাহকারী ঋণ" }, at: "match.body.options[rank=1][0].code", eq: supplier-credit-huaxin }
          - { label: { en: "The escrow-backed loan is blocked (invoice already financed at Lender A)", bn: "এসক্রো-ভিত্তিক ঋণ আটকানো (ইনভয়েস লেন্ডার এ-তে বন্ধক)" }, at: "match.body.options[code=escrow-order-loan-setu-partner][0].eligible", falsy: true }
        facts: { top_option: "match.body.options[rank=1][0].name", options: match.body.options }
      - k: 3
        view: buyer
        login_as: rahima@demo.setu
        route: /app/financing
        highlight: '[data-demo="financing-applied"]'
        caption: { en: "Applied, approved by the (simulated) lender: the gap is covered", bn: "আবেদন, (সিমুলেটেড) ঋণদাতার অনুমোদন: ঘাটতি পূরণ" }
        actions:
          - id: gap
            http: "GET /financing/gap"
            query: { deal_id: "{deal.ref}" }
          - id: apply
            http: "POST /financing/applications"
            json: { deal_id: "{deal.ref}", option_id: supplier-credit-huaxin, amount: "{gap.body.peak_amount.USD}", mode: shortfall }
            save: { application_id: body.id }
          - id: approved
            http: "POST /financing/applications/{apply.application_id}/simulate-approval"
          - id: after
            http: "GET /alerts"
          - id: impact
            http: "POST /financing/impact"
            json: { deal_id: "{deal.ref}", option_id: supplier-credit-huaxin, amount: "{gap.body.peak_amount.USD}", mode: shortfall }
        expect:
          - { label: { en: "Application approved (simulated)", bn: "আবেদন অনুমোদিত (সিমুলেটেড)" }, at: approved.body.application.status, eq: APPROVED }
          - { label: { en: "The 7 Nov shortfall alert is resolved", bn: "৭ নভেম্বরের ঘাটতির সতর্কতা সমাধান হয়েছে" }, at: "after.body.alerts[type=SHORTFALL][status=RESOLVED][0].amount", eq: "1560.00" }
          - { label: { en: "The forecast confirms the original shortfall is covered", bn: "পূর্বাভাসে মূল ঘাটতি পূরণ নিশ্চিত" }, at: impact.body.original_covered, truthy: true }
        facts: { financed: gap.body.peak_amount.USD, total_cost: approved.body.application.total_cost.USD, option: approved.body.application.option_name }

  # ---------------------------------------------------------------- 5
  - n: 5
    id: milestones
    tag: TASK
    title: { en: "30 / 60 / 10, agreed by both sides", bn: "৩০ / ৬০ / ১০, দুই পক্ষই সম্মত" }
    narration:
      en: "Payment is split 30 / 60 / 10: production start, shipment, arrival. Rahima and the supplier both confirmed this schedule when the order was opened. Here is the same record from each side."
      bn: "পেমেন্ট ৩০ / ৬০ / ১০ ভাগে: উৎপাদন শুরু, জাহাজে তোলা, পৌঁছানো। অর্ডার খোলার সময় রহিমা ও সরবরাহকারী দুজনেই এই সূচি নিশ্চিত করেছেন। দুই পক্ষের দৃষ্টিতে একই রেকর্ড।"
    notes:
      en: "Be upfront: the schedule was proposed and confirmed when the deal was opened (see the confirmation timestamps). The propose and confirm screens are in Deals, try them in the sandbox on the draft deal. The supplier sees status only, never the buyer's cost data."
      bn: "খোলাখুলি বলুন: সূচি অর্ডার খোলার সময়ই প্রস্তাব ও নিশ্চিত হয়েছে। সরবরাহকারী শুধু অবস্থা দেখে, ক্রেতার খরচের তথ্য নয়।"
    scenes:
      - k: 1
        view: buyer
        login_as: rahima@demo.setu
        route: "/app/deals/{deal.ref}"
        highlight: '[data-demo="milestone-stepper"]'
        caption: { en: "Three tranches: 30% + 60% + 10% = USD 9,600", bn: "তিন কিস্তি: ৩০% + ৬০% + ১০% = ৯,৬০০ ডলার" }
        actions:
          - id: detail
            http: "GET /deals/{deal.ref}"
        expect:
          - { label: { en: "Tranches are 2,880 / 5,760 / 960", bn: "কিস্তি ২,৮৮০ / ৫,৭৬০ / ৯৬০" }, at: "detail.body.milestones[seq=2][0].amount", eq: "5760.00" }
          - { label: { en: "Buyer confirmed", bn: "ক্রেতা নিশ্চিত করেছেন" }, at: "detail.body.confirmations[party_role=BUYER][0].confirmed", truthy: true }
          - { label: { en: "Supplier confirmed", bn: "সরবরাহকারী নিশ্চিত করেছেন" }, at: "detail.body.confirmations[party_role=SUPPLIER][0].confirmed", truthy: true }
        facts: { split: "30 / 60 / 10" }
      - k: 2
        view: supplier
        login_as: huaxin@demo.setu
        route: "/supplier/{deal.id}"
        highlight: '[data-demo="supplier-schedule"]'
        caption: { en: "The supplier's view (in Chinese): same schedule, status only", bn: "সরবরাহকারীর দৃষ্টি (চীনা ভাষায়): একই সূচি, শুধু অবস্থা" }
        actions:
          - id: sdeal
            http: "GET /deals/{deal.ref}"
            as: huaxin@demo.setu
        expect:
          - { label: { en: "The supplier sees the same three tranches", bn: "সরবরাহকারী একই তিন কিস্তি দেখে" }, at: sdeal.body.milestones, len_gte: 3 }
          - { label: { en: "No landed-cost data is shown to the supplier", bn: "সরবরাহকারীকে ল্যান্ডেড খরচ দেখানো হয় না" }, at: sdeal.body.expected_sale_value, falsy: true }

