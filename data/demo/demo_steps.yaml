            json: {}
          - id: detail
            http: "GET /deals/{deal.ref}"
          - id: fx
            call: fx.route_compare
            args: { amount: "2880.00" }
        expect:
          - { label: { en: "M1 is RELEASED", bn: "এম১ ছাড় হয়েছে" }, at: "detail.body.milestones[seq=1][0].status", eq: RELEASED }
          - { label: { en: "Paid in CNY", bn: "সিএনওয়াইতে পরিশোধ" }, at: "detail.body.milestones[seq=1][0].settlement.currency", eq: CNY }
          - { label: { en: "The CNY route is cheaper than the USD route", bn: "সিএনওয়াই রুট ইউএসডি রুটের চেয়ে সস্তা" }, at: fx.body.cheaper, eq: CNY }
        facts: { paid_cny: "detail.body.milestones[seq=1][0].settlement.counter_amount", fx_rate: "detail.body.milestones[seq=1][0].settlement.fx_rate", fx_saving_usd: fx.body.saving }

