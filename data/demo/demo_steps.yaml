          - { label: { en: "It is Tier 2 (one tap)", bn: "এটি টিয়ার ২ (এক ট্যাপ)" }, at: release.body.risk.tier, eq: "2" }
          - { label: { en: "No money moved yet", bn: "এখনও টাকা যায়নি" }, at: release.body.milestone.status, eq: PENDING_APPROVAL }
        facts: { tier: release.body.risk.tier, reason: "release.body.risk.reasons[0]" }
      - k: 3
